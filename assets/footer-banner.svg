<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 180" width="100%" height="180">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080B16"/>
      <stop offset="50%" stop-color="#0C1224"/>
      <stop offset="100%" stop-color="#10172A"/>
    </linearGradient>

    <linearGradient id="footerBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="eqGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <filter id="glowFtr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="ftrGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#00E5FF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes eq1 { 0%, 100% { height: 8px; y: 46px; } 50% { height: 32px; y: 22px; } }
    @keyframes eq2 { 0%, 100% { height: 26px; y: 28px; } 50% { height: 10px; y: 44px; } }
    @keyframes eq3 { 0%, 100% { height: 14px; y: 40px; } 50% { height: 34px; y: 20px; } }
    @keyframes eq4 { 0%, 100% { height: 32px; y: 22px; } 50% { height: 14px; y: 40px; } }
    @keyframes eq5 { 0%, 100% { height: 18px; y: 36px; } 50% { height: 36px; y: 18px; } }
    @keyframes pulseLed { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    @keyframes sonarWave { 0% { r: 6px; opacity: 1; } 100% { r: 36px; opacity: 0; } }

    .eq-bar-1 { animation: eq1 1.2s ease-in-out infinite; }
    .eq-bar-2 { animation: eq2 0.9s ease-in-out infinite; }
    .eq-bar-3 { animation: eq3 1.5s ease-in-out infinite; }
    .eq-bar-4 { animation: eq4 1.1s ease-in-out infinite; }
    .eq-bar-5 { animation: eq5 1.3s ease-in-out infinite; }
    .led-blink { animation: pulseLed 1.8s ease-in-out infinite; }
    .sonar-ring { animation: sonarWave 2.2s cubic-bezier(0.2, 0.8, 0.4, 1) infinite; }

    .mono-footer {
      font-family: 'SF Mono', Monaco, 'Fira Code', 'Roboto Mono', monospace;
    }
    .hud-quote {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-style: italic;
    }
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="856" height="176" rx="14" fill="url(#footerBg)" stroke="url(#footerBorder)" stroke-width="1.5"/>
  <rect x="2" y="2" width="856" height="176" rx="14" fill="url(#ftrGrid)"/>

  <!-- HUD Corner Brackets -->
  <path d="M 12 24 L 12 12 L 24 12" fill="none" stroke="#00E5FF" stroke-width="1.5"/>
  <path d="M 848 24 L 848 12 L 836 12" fill="none" stroke="#A855F7" stroke-width="1.5"/>
  <path d="M 12 156 L 12 168 L 24 168" fill="none" stroke="#00E5FF" stroke-width="1.5"/>
  <path d="M 848 156 L 848 168 L 836 168" fill="none" stroke="#A855F7" stroke-width="1.5"/>

  <!-- Frequency Equalizer Graphic -->
  <g transform="translate(60, 40)">
    <rect x="0" y="26" width="5" height="28" rx="2.5" fill="url(#eqGrad)" class="eq-bar-1"/>
    <rect x="10" y="30" width="5" height="24" rx="2.5" fill="url(#eqGrad)" class="eq-bar-2"/>
    <rect x="20" y="40" width="5" height="14" rx="2.5" fill="url(#eqGrad)" class="eq-bar-3"/>
    <rect x="30" y="24" width="5" height="30" rx="2.5" fill="url(#eqGrad)" class="eq-bar-4"/>
    <rect x="40" y="36" width="5" height="18" rx="2.5" fill="url(#eqGrad)" class="eq-bar-5"/>
    <rect x="50" y="28" width="5" height="26" rx="2.5" fill="url(#eqGrad)" class="eq-bar-2"/>
    <rect x="60" y="34" width="5" height="20" rx="2.5" fill="url(#eqGrad)" class="eq-bar-4"/>
    <rect x="70" y="42" width="5" height="12" rx="2.5" fill="url(#eqGrad)" class="eq-bar-1"/>
  </g>

  <!-- Central Motivational / Engineering Statement -->
  <g transform="translate(170, 48)">
    <text x="0" y="20" class="hud-quote" font-size="15" font-weight="600" fill="#F8FAFC" letter-spacing="0.5">
      &ldquo;Architecting real-time edge intelligence, robust software pipelines, and high-fidelity user experiences.&rdquo;
    </text>

    <!-- Sub Telemetry Status -->
    <g transform="translate(0, 42)">
      <circle cx="6" cy="6" r="4" fill="#00E5FF" class="led-blink" filter="url(#glowFtr)"/>
      <text x="18" y="10" class="mono-footer" font-size="11" font-weight="600" fill="#38BDF8" letter-spacing="1">
        TELEMETRY: ALL SUBSYSTEMS NOMINAL // AVAILABLE FOR TECHNICAL CHALLENGES
      </text>
    </g>

    <!-- Bottom Metadata -->
    <g transform="translate(0, 72)">
      <text x="0" y="10" class="mono-footer" font-size="9.5" fill="#64748B" letter-spacing="1">
        NAVEEN KUMAR S &bull; MADRAS INSTITUTE OF TECHNOLOGY (MIT) &bull; CHENNAI, INDIA
      </text>
    </g>
  </g>

  <!-- Right Signal Sonar Radar Wave -->
  <g transform="translate(775, 85)">
    <circle cx="0" cy="0" r="6" fill="#00E5FF" filter="url(#glowFtr)"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#3B82F6" stroke-width="1.2" class="sonar-ring"/>
    <circle cx="0" cy="0" r="26" fill="none" stroke="#A855F7" stroke-width="1" class="sonar-ring" style="animation-delay: 0.8s;"/>
  </g>
</svg>
